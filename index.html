<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odds Arbitrage Analyser</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }
  .app { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 1.25rem; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
  .left-panel, .right-panel { display: flex; flex-direction: column; gap: 12px; }
  select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: #fff; color: #333; margin-bottom: 8px; }
  button { padding: 8px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: #fff; color: #333; cursor: pointer; width: 100%; }
  button:hover { background: #f0f0f0; }
  button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  button.primary:hover { background: #333; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 1rem 1.25rem; }
  .match-card { cursor: pointer; transition: border-color 0.15s; margin-bottom: 8px; border-radius: 8px; border: 1px solid #e8e8e8; padding: 0.75rem 1rem; background: #fff; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .match-card:hover { border-color: #bbb; }
  .match-card.selected { border-color: #1a1a1a; background: #fafafa; }
  .match-name { font-size: 12px; font-weight: 600; color: #111; margin-bottom: 2px; }
  .match-time { font-size: 11px; color: #888; }
  .arb-badge { font-size: 13px; font-weight: 800; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .arb-1 { background: #fff3cd; color: #856404; }
  .arb-2 { background: #d4edda; color: #155724; }
  .arb-3 { background: #28a745; color: #fff; }
  .no-arb-badge { font-size: 10px; color: #ccc; }
  .log-box { background: #1a1a1a; color: #e0e0e0; font-family: monospace; font-size: 11px; border-radius: 8px; padding: 0.85rem; height: 150px; overflow-y: auto; white-space: pre-wrap; line-height: 1.6; }
  .log-ok { color: #7ec77e; } .log-err { color: #f08080; } .log-info { color: #80c8f0; }
  .section-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; font-weight: 600; }
  .odds-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .odds-table th { font-size: 10px; color: #aaa; text-transform: uppercase; padding: 6px 10px; text-align: center; border-bottom: 1px solid #f0f0f0; font-weight: 500; }
  .odds-table th:first-child { text-align: left; }
  .odds-table td { padding: 7px 10px; text-align: center; border-bottom: 1px solid #f8f8f8; }
  .odds-table td:first-child { text-align: left; font-weight: 500; color: #333; font-size: 12px; }
  .odds-table tr.summary-row td { border-top: 1px solid #eee; font-weight: 700; background: #fafafa; }
  .prob-val { font-size: 14px; font-weight: 700; display: block; }
  .odds-sub { font-size: 10px; color: #aaa; display: block; }
  .best { background: #e8f5e0; border-radius: 5px; padding: 3px 8px; } .best .prob-val { color: #2a5a10; }
  .worst { background: #fde8df; border-radius: 5px; padding: 3px 8px; } .worst .prob-val { color: #712B13; }
  .na { color: #ddd; }
  .arb-box { background: #f0fbf0; border: 1px solid #b2d99b; border-radius: 8px; padding: 0.75rem 1rem; font-size: 13px; color: #2a5a10; margin-top: 10px; }
  .no-arb-box { background: #fff8f0; border: 1px solid #f5c4b3; border-radius: 8px; padding: 0.75rem 1rem; font-size: 13px; color: #712B13; margin-top: 10px; }
  .dis-low { background:#f5f5f5;color:#888;border-radius:5px;padding:2px 8px;font-weight:600;font-size:12px; }
  .dis-mod { background:#fff3cd;color:#856404;border-radius:5px;padding:2px 8px;font-weight:600;font-size:12px; }
  .dis-high { background:#d4edda;color:#155724;border-radius:5px;padding:2px 8px;font-weight:600;font-size:12px; }
  .dis-ext { background:#28a745;color:#fff;border-radius:5px;padding:2px 8px;font-weight:700;font-size:12px; }
  .summary-box { background:#f9f9f7;border:1px solid #e8e8e4;border-radius:8px;padding:1rem;margin-top:10px; }
  .summary-box h3 { font-size:10px;text-transform:uppercase;color:#aaa;font-weight:600;margin-bottom:10px; }
  .summary-row-item { display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px; }
  .summary-row-item:last-child { border-bottom:none; }
  .hidden { display: none; }
  .spinner { display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#888;border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align:center;padding:1.5rem;color:#bbb;font-size:13px; }
  .match-title { font-size:15px;font-weight:600;color:#111;margin-bottom:4px; }
  .match-subtitle { font-size:12px;color:#888;margin-bottom:14px; }
  .prompt-box { background:#f9f9f7;border:1px solid #e0e0dc;border-radius:8px;padding:1rem;font-size:11px;font-family:monospace;white-space:pre-wrap;color:#333;max-height:180px;overflow-y:auto; }
  .placeholder { display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;color:#ccc;font-size:13px;gap:8px; }
  .bm-tag { display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;margin-left:4px; }
  .bm-exchange { background:#deeefb;color:#0C447C; }
  .bm-prediction { background:#f0e6fb;color:#5a0c7c; }
  .bm-sportsbook { background:#f0f0f0;color:#555; }
  .req-counter { font-size:11px;color:#aaa;text-align:center;margin-top:6px; }
  .scan-note { font-size:11px;color:#aaa;margin-top:6px;text-align:center; }
</style>
</head>
<body>
<div class="app">
  <h1>Odds Arbitrage Analyser</h1>
  <div class="layout">
    <div class="left-panel">
      <div class="card">
        <div class="section-label">1 · category</div>
        <select id="categorySelect" onchange="onCategory()">
          <option value="">select category...</option>
          <option value="12">🎾 Tennis</option>
          <option value="13">⚾ Baseball (MLB)</option>
          <option value="11">🏀 Basketball</option>
        </select>
        <div class="section-label" style="margin-top:6px">2 · event / tournament</div>
        <select id="tournamentSelect" disabled><option value="">pick category first</option></select>
        <button onclick="loadFixtures()">⟳ load matches <span style="font-size:10px;color:#999">(1 req)</span></button>
        <div class="req-counter" id="reqCounter">requests this session: 0</div>
      </div>
      <div class="card">
        <div class="section-label">3 · matches</div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#666;margin-bottom:8px;cursor:pointer"><input type="checkbox" id="hide12h" onchange="renderFixtureList()"> hide matches starting within 12h</label>
        <button id="scanBtn" onclick="scanAll()" class="hidden" style="margin-bottom:8px">⚡ scan all for arbs <span id="scanCost" style="font-size:10px;color:#999"></span></button>
        <div class="scan-note hidden" id="scanNote">! = &lt;2% · !! = 2-5% · !!! = 5%+ profit</div>
        <div id="fixtureList"><div class="empty">select a category & tournament</div></div>
      </div>
    </div>
    <div class="right-panel">
      <div class="card">
        <div id="placeholder" class="placeholder"><span style="font-size:28px">📊</span><span>select a match to view odds</span></div>
        <div id="oddsContent" class="hidden">
          <div class="match-title" id="matchTitle"></div>
          <div class="match-subtitle" id="matchSubtitle"></div>
          <div style="overflow-x:auto"><table class="odds-table" id="oddsTable"></table></div>
          <div id="summaryBox"></div>
          <div id="arbBox"></div>
        </div>
      </div>
      <div id="analysisCard" class="card hidden">
        <div class="section-label">analysis prompt</div>
        <div class="prompt-box" id="promptBox"></div>
        <button onclick="copyPrompt()" style="margin-top:8px">Copy prompt</button>
      </div>
      <button class="primary hidden" id="analyseBtn" onclick="runAnalysis()">Analyse with Claude ↗</button>
      <div class="card">
        <div class="section-label">debug log</div>
        <div class="log-box" id="logBox">ready\n</div>
      </div>
    </div>
  </div>
</div>
<script>
const API_KEY = 'a0eb5926-208a-47f4-be4c-a7c0d1ce5dfc';
const BASE = 'https://api.oddspapi.io/v4';
let reqCount = 0, currentData = null, fixturesCache = {}, oddsCache = {}, P1_ID = null, P2_ID = null;

const BM_META = {
  'betfair-ex':{label:'Betfair Exchange',type:'exchange'},'betfair':{label:'Betfair SP',type:'exchange'},
  'smarkets':{label:'Smarkets',type:'exchange'},'matchbook':{label:'Matchbook',type:'exchange'},
  'pinnacle':{label:'Pinnacle',type:'sportsbook'},'bet365':{label:'Bet365',type:'sportsbook'},
  'williamhill':{label:'William Hill',type:'sportsbook'},'williamhill-uk':{label:'William Hill UK',type:'sportsbook'},
  'unibet':{label:'Unibet',type:'sportsbook'},'unibet-uk':{label:'Unibet UK',type:'sportsbook'},
  'betway':{label:'Betway',type:'sportsbook'},'sky-bet':{label:'Sky Bet',type:'sportsbook'},'skybet':{label:'Sky Bet',type:'sportsbook'},
  'ladbrokes':{label:'Ladbrokes',type:'sportsbook'},'coral':{label:'Coral',type:'sportsbook'},
  'paddy-power':{label:'Paddy Power',type:'sportsbook'},'paddypower':{label:'Paddy Power',type:'sportsbook'},
  'betvictor':{label:'BetVictor',type:'sportsbook'},'bet-victor':{label:'BetVictor',type:'sportsbook'},
  'virgin-bet':{label:'Virgin Bet',type:'sportsbook'},'virginbet':{label:'Virgin Bet',type:'sportsbook'},
  '888sport':{label:'888sport',type:'sportsbook'},'mrgreen':{label:'Mr Green',type:'sportsbook'},
  'betfred':{label:'Betfred',type:'sportsbook'},'pokerstars':{label:'PokerStars',type:'sportsbook'},'pokerstars-uk':{label:'PokerStars UK',type:'sportsbook'},
  'draftkings':{label:'DraftKings',type:'sportsbook'},'sportingbet':{label:'Sportingbet',type:'sportsbook'},
  'spreadex':{label:'Spreadex',type:'sportsbook'},'boylesports':{label:'BoyleSports',type:'sportsbook'},
  'grosvenor':{label:'Grosvenor',type:'sportsbook'},'tote':{label:'Tote',type:'sportsbook'},
  'kalshi':{label:'Kalshi',type:'prediction'},'polymarket':{label:'Polymarket',type:'prediction'},
};
const PRIORITY_NAMES = ['wimbledon','us open','french open','australian open','roland garros','indian wells','miami','madrid','rome','cincinnati','nottingham','queen','eastbourne','birmingham','halle','berlin','mlb','major league','nba','wnba','euroleague'];
const UK_POLITICS_KEYS = ['uk','united kingdom','britain','british','prime minister','general election','labour','conservative','tory','starmer','parliament','commons','scotland','wales','london mayor'];

function log(m,t){const b=document.getElementById('logBox');const c=t==='ok'?'log-ok':t==='err'?'log-err':'log-info';const p=t==='ok'?'✓ ':t==='err'?'✗ ':'→ ';b.innerHTML+='<span class="'+c+'">'+p+m+'</span>\n';b.scrollTop=b.scrollHeight;}
function countReq(){reqCount++;document.getElementById('reqCounter').textContent='requests this session: '+reqCount+' (250/mo free)';}
async function get(path){const s=path.includes('?')?'&':'?';const r=await fetch(BASE+path+s+'apiKey='+API_KEY);countReq();if(!r.ok){const t=await r.text();let m='HTTP '+r.status;try{const j=JSON.parse(t);m+=': '+(j.error?.message||'');}catch(e){}throw new Error(m);}return r.json();}
function toProb(o){return o?1/o*100:null;}
function fmtProb(p){return p!=null?p.toFixed(1)+'%':null;}
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function disBand(pp){if(pp>=8)return{cls:'dis-ext',label:'EXTREME'};if(pp>=5)return{cls:'dis-high',label:'HIGH'};if(pp>=2)return{cls:'dis-mod',label:'MODERATE'};return{cls:'dis-low',label:'LOW'};}
function typeTag(t){if(t==='exchange')return'<span class="bm-tag bm-exchange">EX</span>';if(t==='prediction')return'<span class="bm-tag bm-prediction">PM</span>';return'<span class="bm-tag bm-sportsbook">SB</span>';}

function getPrices(bookmaker){
  if(!bookmaker?.markets)return{p1:null,p2:null};
  const market=Object.values(bookmaker.markets)[0];
  if(!market?.outcomes)return{p1:null,p2:null};
  const priceOf=o=>{if(!o?.players)return null;const a=Object.values(o.players).find(p=>p.active!==false);return a?.price?parseFloat(a.price):null;};
  const outcomes=Object.entries(market.outcomes).map(([key,o])=>({key,price:priceOf(o)})).filter(o=>o.price!==null);
  if(outcomes.length<2)return{p1:outcomes[0]?.price||null,p2:null};
  const sorted=[...outcomes].sort((a,b)=>String(a.key).localeCompare(String(b.key),undefined,{numeric:true}));
  return{p1:sorted[0].price,p2:sorted[1].price};
}

function correctFlips(results,p1name){
  const rows=Object.values(results).filter(r=>r.p1&&r.p2);
  if(rows.length<4){log('flip-check skipped (need 4+ books)','info');return;}
  const share=r=>{const a=toProb(r.p1),b=toProb(r.p2);return a/(a+b);};
  const cons=median(rows.map(share));
  log('consensus '+p1name.split(',')[0]+' share: '+(cons*100).toFixed(1)+'%','info');
  let flips=0;
  Object.values(results).forEach(r=>{
    if(!r.p1||!r.p2)return;
    const s=share(r);
    if(Math.abs((1-s)-cons)+0.04<Math.abs(s-cons)){const t=r.p1;r.p1=r.p2;r.p2=t;r.flipped=true;flips++;log('⟲ FLIP: '+r.label,'err');}
  });
  log(flips?'corrected '+flips+' flipped book(s)':'all books consistent ✓',flips?'ok':'ok');
}

// Compute arb % from a results object (post flip-correction). Returns profit% or null.
function arbProfit(results){
  const av=Object.values(results);
  const p1O=av.map(r=>r.p1).filter(Boolean),p2O=av.map(r=>r.p2).filter(Boolean);
  if(!p1O.length||!p2O.length)return null;
  const arb=1/Math.max(...p1O)+1/Math.max(...p2O);
  return arb<1?(1/arb-1)*100:null;
}

function parseResults(bo,logEach,p1,p2){
  const results={};let filtered=0;
  Object.keys(bo).forEach(slug=>{
    if(!BM_META[slug]){filtered++;return;}
    const{p1:a,p2:b}=getPrices(bo[slug]);
    if(a){results[slug]={label:BM_META[slug].label,type:BM_META[slug].type,p1:a,p2:b};
      if(logEach)log(BM_META[slug].label+': '+a.toFixed(2)+(b?' / '+b.toFixed(2):''),'ok');}
  });
  if(logEach)log('filtered '+filtered+' non-UK books','info');
  return results;
}

function onCategory(){
  const cat=document.getElementById('categorySelect').value;
  const sel=document.getElementById('tournamentSelect');
  sel.disabled=false;
  if(cat)loadTournaments(cat,'oddspapi_tournaments_'+cat);
  else{sel.disabled=true;sel.innerHTML='<option value="">pick category first</option>';}
}

async function loadTournaments(sportId,cacheKey){
  const sel=document.getElementById('tournamentSelect');
  const cached=localStorage.getItem(cacheKey);
  if(cached){populateTournaments(JSON.parse(cached));log('tournaments from cache (0 req)','ok');return;}
  sel.innerHTML='<option value="">loading (1 req)...</option>';
  try{
    const data=await get('/tournaments?sportId='+sportId+'&language=en');
    const raw=Array.isArray(data)?data:(data.tournaments||data.data||[]);
    const seen=new Set();
    const active=raw.filter(t=>{const n=(t.tournamentName||t.name||'').trim();const f=(t.futureFixtures||0)+(t.upcomingFixtures||0);if(f===0||seen.has(n))return false;seen.add(n);return true;})
      .sort((a,b)=>((b.upcomingFixtures||0)+(b.futureFixtures||0))-((a.upcomingFixtures||0)+(a.futureFixtures||0)));
    localStorage.setItem(cacheKey,JSON.stringify(active));
    populateTournaments(active);
    log(active.length+' tournaments loaded & cached','ok');
  }catch(e){sel.innerHTML='<option value="">failed</option>';log('tournament load failed: '+e.message,'err');}
}

function baseEvent(name){
  // strip sub-event descriptors to get the parent event name
  return name.replace(/\b(men'?s|women'?s|mixed|boys'?|girls'?)\b/gi,'')
    .replace(/\b(singles|doubles)\b/gi,'')
    .replace(/\b(qualifying|qualification|qualifiers?)\b/gi,'')
    .replace(/\s{2,}/g,' ').replace(/[,\-–]\s*$/,'').trim();
}
function populateTournaments(list){
  const sel=document.getElementById('tournamentSelect');
  sel.innerHTML='<option value="">select...</option>';
  // exclude qualifying events entirely
  list=list.filter(t=>!/qualif/i.test(t.tournamentName||t.name||''));
  // group by base event name
  const groups={};
  list.forEach(t=>{
    const full=(t.tournamentName||t.name||'');
    const base=baseEvent(full)||full;
    (groups[base]=groups[base]||[]).push(t);
  });
  const isPri=n=>PRIORITY_NAMES.some(p=>n.toLowerCase().includes(p));
  const entries=Object.entries(groups).sort((a,b)=>{
    const ap=isPri(a[0])?1:0,bp=isPri(b[0])?1:0;
    if(ap!==bp)return bp-ap;
    const cnt=g=>g.reduce((s,t)=>s+((t.upcomingFixtures||0)+(t.futureFixtures||0)),0);
    return cnt(b[1])-cnt(a[1]);
  });
  entries.slice(0,60).forEach(([base,tours])=>{
    if(tours.length===1){
      const t=tours[0];
      const o=document.createElement('option');
      o.value=t.tournamentId;
      o.textContent=(isPri(base)?'⭐ ':'')+base+' ('+((t.upcomingFixtures||0)+(t.futureFixtures||0))+')';
      sel.appendChild(o);
    }else{
      const g=document.createElement('optgroup');
      g.label=(isPri(base)?'⭐ ':'')+base;
      // singles first, then others
      tours.sort((a,b)=>{const s=n=>/singles/i.test(n)?0:1;return s(a.tournamentName||'')-s(b.tournamentName||'');});
      tours.forEach(t=>{
        const full=t.tournamentName||t.name||'';
        // show only the sub-event descriptor as the option label
        let sub=full.replace(base,'').replace(/[,\-–]/g,' ').replace(/\s{2,}/g,' ').trim()||full;
        const o=document.createElement('option');
        o.value=t.tournamentId;
        o.textContent=sub+' ('+((t.upcomingFixtures||0)+(t.futureFixtures||0))+')';
        g.appendChild(o);
      });
      sel.appendChild(g);
    }
  });
}

async function loadFixtures(){
  const tid=document.getElementById('tournamentSelect').value;
  if(!tid){log('select a tournament first','err');return;}
  log('loading fixtures (1 req)...','info');
  document.getElementById('fixtureList').innerHTML='<div class="empty"><span class="spinner"></span>loading...</div>';
  document.getElementById('oddsContent').classList.add('hidden');
  document.getElementById('placeholder').classList.remove('hidden');
  document.getElementById('analysisCard').classList.add('hidden');
  document.getElementById('analyseBtn').classList.add('hidden');
  fixturesCache={};
  try{
    const data=await get('/fixtures?tournamentId='+tid+'&statusId=0&language=en');
    let fixtures=Array.isArray(data)?data:(data.fixtures||data.data||[]);
    // Exclude fixtures where both participants aren't known yet (qualifier/TBD placeholders)
    const tbd=s=>!s||/tbd|tba|qualifier|winner of|loser of|to be/i.test(s)||/^(R\d+P\d+|[QW]\d+|QF\d*|SF\d*|F\d*|P\d+|Seed \d+)$/i.test(s.trim());
    const before=fixtures.length;
    fixtures=fixtures.filter(f=>!tbd(f.participant1Name)&&!tbd(f.participant2Name));
    const noOdds=fixtures.filter(f=>f.hasOdds===false).length;
    fixtures=fixtures.filter(f=>f.hasOdds!==false);
    log('fixtures: '+fixtures.length+' playable ('+(before-fixtures.length-noOdds)+' TBD, '+noOdds+' no-odds excluded)',fixtures.length?'ok':'err');
    if(!fixtures.length){document.getElementById('fixtureList').innerHTML='<div class="empty">no upcoming matches with both players known</div>';return;}
    fixtures.slice(0,20).forEach((f,i)=>{fixturesCache['f'+i]=f;});
    renderFixtureList();
    document.getElementById('scanBtn').classList.remove('hidden');
    document.getElementById('scanCost').textContent='('+Object.keys(fixturesCache).length+' req)';
    document.getElementById('scanNote').classList.remove('hidden');
  }catch(e){document.getElementById('fixtureList').innerHTML='<div class="empty">error: '+e.message+'</div>';log('failed: '+e.message,'err');}
}

function renderFixtureList(){
  const hide12=document.getElementById('hide12h')?.checked;
  const cutoff=Date.now()+12*3600*1000;
  const entries=Object.entries(fixturesCache).filter(([k,f])=>{
    if(!hide12)return true;
    if(!f.startTime)return true;
    return new Date(f.startTime).getTime()>cutoff;
  });
  if(!entries.length){document.getElementById('fixtureList').innerHTML='<div class="empty">no matches (toggle hides those within 12h)</div>';return;}
  // sort: arbs first, then unscanned, thin markets last
  entries.sort((a,b)=>{
    const rank=f=>f._arb!=null?0:f._thin?2:1;
    return rank(a[1])-rank(b[1]);
  });
  document.getElementById('fixtureList').innerHTML=entries.map(([k,f])=>{
    const p1=(f.participant1Name||'?').split(',')[0],p2=(f.participant2Name||'?').split(',')[0];
    const time=f.startTime?new Date(f.startTime).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'TBC';
    let badge='',style='';
    if(f._thin){badge='<span class="no-arb-badge">'+f._books+' books — thin</span>';style='opacity:0.45';}
    else if(f._arb!=null){
      if(f._arb>=5)badge='<span class="arb-badge arb-3">!!!</span>';
      else if(f._arb>=2)badge='<span class="arb-badge arb-2">!!</span>';
      else badge='<span class="arb-badge arb-1">!</span>';
      badge='<span title="'+f._arb.toFixed(2)+'% arb">'+badge+'</span>';
    }else if(f._scanned)badge='<span class="no-arb-badge">no arb ('+(f._books||'?')+' books)</span>';
    return '<div class="match-card" id="mc-'+k+'" style="'+style+'" onclick="loadOdds(\''+k+'\')"><div><div class="match-name">'+p1+' vs '+p2+'</div><div class="match-time">'+time+'</div></div>'+badge+'</div>';
  }).join('');
}

async function fetchOdds(fid){
  if(oddsCache[fid]){log('odds from cache (0 req)','ok');return oddsCache[fid];}
  const data=await get('/odds?fixtureId='+fid+'&oddsFormat=decimal&verbosity=3');
  oddsCache[fid]=data;
  return data;
}

async function scanAll(){
  const keys=Object.keys(fixturesCache);
  const btn=document.getElementById('scanBtn');
  btn.disabled=true;
  log('scanning '+keys.length+' matches for arbs...','info');
  for(let i=0;i<keys.length;i++){
    const k=keys[i],f=fixturesCache[k];
    btn.textContent='scanning '+(i+1)+'/'+keys.length+'...';
    try{
      const data=await fetchOdds(f.fixtureId||f.id);
      const results=parseResults(data.bookmakerOdds||{},false,'','');
      f._books=Object.keys(results).length;
      if(f._books<3){
        f._thin=true;f._scanned=true;
        log('thin market ('+f._books+' books): '+(f.participant1Name||'').split(',')[0]+' vs '+(f.participant2Name||'').split(',')[0],'info');
      }else{
        correctFlipsQuiet(results);
        f._arb=arbProfit(results);
        f._scanned=true;
        if(f._arb!=null)log('ARB '+f._arb.toFixed(2)+'%: '+(f.participant1Name||'').split(',')[0]+' vs '+(f.participant2Name||'').split(',')[0],'ok');
      }
    }catch(e){f._scanned=true;log('scan fail: '+e.message,'err');}
    renderFixtureList();
    if(i<keys.length-1)await new Promise(r=>setTimeout(r,2500));
  }
  btn.textContent='⚡ scan all for arbs';
  btn.disabled=false;
  const found=keys.filter(k=>fixturesCache[k]._arb!=null).length;
  log('scan complete — '+found+' arb(s) found. VERIFY on bookmaker sites before staking.','ok');
}

// silent version for scanning
function correctFlipsQuiet(results){
  const rows=Object.values(results).filter(r=>r.p1&&r.p2);
  if(rows.length<4)return;
  const share=r=>{const a=toProb(r.p1),b=toProb(r.p2);return a/(a+b);};
  const cons=median(rows.map(share));
  Object.values(results).forEach(r=>{
    if(!r.p1||!r.p2)return;
    const s=share(r);
    if(Math.abs((1-s)-cons)+0.04<Math.abs(s-cons)){const t=r.p1;r.p1=r.p2;r.p2=t;r.flipped=true;}
  });
}

async function loadOdds(key){
  const f=fixturesCache[key];
  if(!f)return;
  document.querySelectorAll('.match-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('mc-'+key).classList.add('selected');
  const p1=f.participant1Name||'Player 1',p2=f.participant2Name||'Player 2';
  const fid=f.fixtureId||f.id;
  const time=f.startTime?new Date(f.startTime).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  document.getElementById('placeholder').classList.add('hidden');
  document.getElementById('oddsContent').classList.remove('hidden');
  document.getElementById('matchTitle').textContent=p1+' vs '+p2;
  document.getElementById('matchSubtitle').textContent=time;
  document.getElementById('oddsTable').innerHTML='<tr><td colspan="3" style="padding:1rem;color:#aaa"><span class="spinner"></span>loading...</td></tr>';
  document.getElementById('summaryBox').innerHTML='';
  document.getElementById('arbBox').innerHTML='';
  try{
    const data=await fetchOdds(fid);
    const results=parseResults(data.bookmakerOdds||{},true,p1,p2);
    if(!Object.keys(results).length){document.getElementById('oddsTable').innerHTML='<tr><td colspan="3" class="empty">no UK odds found</td></tr>';return;}
    correctFlips(results,p1);
    renderTable(p1,p2,results);
    currentData={p1,p2,time,results};
    document.getElementById('analyseBtn').classList.remove('hidden');
  }catch(e){document.getElementById('oddsTable').innerHTML='<tr><td colspan="3" style="color:#f08080;padding:1rem">'+e.message+'</td></tr>';log('failed: '+e.message,'err');}
}

function renderTable(p1,p2,results){
  const av=Object.values(results);
  const p1O=av.map(r=>r.p1).filter(Boolean),p2O=av.map(r=>r.p2).filter(Boolean);
  const bestP1=p1O.length?Math.max(...p1O):null,worstP1=p1O.length?Math.min(...p1O):null;
  const bestP2=p2O.length?Math.max(...p2O):null,worstP2=p2O.length?Math.min(...p2O):null;
  const p1s=p1.split(',')[0],p2s=p2.split(',')[0];
  const cell=(o,c)=>o?'<span class="'+c+'"><span class="prob-val">'+fmtProb(toProb(o))+'</span><span class="odds-sub">('+o.toFixed(2)+')</span></span>':'<span class="na">—</span>';
  let html='<thead><tr><th>bookmaker</th><th>'+p1s+'</th><th>'+p2s+'</th></tr></thead><tbody>';
  av.forEach(r=>{
    const c1=r.p1===bestP1?'best':(p1O.length>1&&r.p1===worstP1)?'worst':'';
    const c2=r.p2&&r.p2===bestP2?'best':(p2O.length>1&&r.p2===worstP2)?'worst':'';
    html+='<tr><td>'+r.label+typeTag(r.type)+(r.flipped?'<span class="bm-tag" style="background:#fde8df;color:#712B13">⟲ fixed</span>':'')+'</td><td>'+cell(r.p1,c1)+'</td><td>'+cell(r.p2,c2)+'</td></tr>';
  });
  html+='<tr class="summary-row"><td>best available (longest odds)</td><td>'+cell(bestP1,'best')+'</td><td>'+cell(bestP2,'best')+'</td></tr></tbody>';
  document.getElementById('oddsTable').innerHTML=html;

  const p1P=p1O.map(toProb),p2P=p2O.map(toProb);
  const disP1=p1P.length>1?Math.max(...p1P)-Math.min(...p1P):null;
  const disP2=p2P.length>1?Math.max(...p2P)-Math.min(...p2P):null;
  const findPair=l=>{let mx=0,pr='';for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const d=Math.abs(l[i].prob-l[j].prob);if(d>mx){mx=d;pr=l[i].label+' vs '+l[j].label;}}return pr;};
  const l1=av.filter(r=>r.p1).map(r=>({label:r.label,prob:toProb(r.p1)}));
  const l2=av.filter(r=>r.p2).map(r=>({label:r.label,prob:toProb(r.p2)}));
  const row=(lb,d,pr)=>{if(d===null)return'';const b=disBand(d);return'<div class="summary-row-item"><span style="font-size:12px;color:#555">'+lb+'</span><div style="text-align:right"><span class="'+b.cls+'">'+d.toFixed(1)+'pp — '+b.label+'</span><div style="font-size:10px;color:#aaa;margin-top:2px">'+pr+'</div></div></div>';};
  document.getElementById('summaryBox').innerHTML='<div class="summary-box"><h3>Market Disagreement</h3>'+row(p1s,disP1,findPair(l1))+row(p2s,disP2,findPair(l2))+'</div>';

  if(bestP1&&bestP2){
    const arb=1/bestP1+1/bestP2;
    if(arb<1){const pf=((1/arb-1)*100).toFixed(2);
      document.getElementById('arbBox').innerHTML='<div class="arb-box">⚡ Arbitrage — ~'+pf+'% profit (implied '+(arb*100).toFixed(1)+'%)<div style="font-size:11px;margin-top:4px;opacity:.8">⚠ verify both prices on the actual sites before staking</div></div>';
      log('ARB ~'+pf+'% — VERIFY before betting','ok');}
    else document.getElementById('arbBox').innerHTML='<div class="no-arb-box">No arbitrage — combined implied: '+(arb*100).toFixed(1)+'%</div>';
  }
}

function runAnalysis(){
  if(!currentData)return;
  const{p1,p2,time,results}=currentData;
  const av=Object.values(results);
  const txt=av.map(r=>'  '+r.label+' ['+r.type+']: '+p1.split(',')[0]+' @ '+r.p1.toFixed(2)+' ('+fmtProb(toProb(r.p1))+')'+(r.p2?', '+p2.split(',')[0]+' @ '+r.p2.toFixed(2)+' ('+fmtProb(toProb(r.p2))+')':'')).join('\n');
  const b1=Math.max(...av.map(r=>r.p1).filter(Boolean)),b2=Math.max(...av.map(r=>r.p2).filter(Boolean));
  const msg='Analyse these odds across bookmakers/prediction markets:\n\nEvent: '+p1+' vs '+p2+(time?' ('+time+')':'')+'\n\n'+txt+'\n\nBest available: '+p1.split(',')[0]+' @ '+b1.toFixed(2)+', '+p2.split(',')[0]+' @ '+b2.toFixed(2)+'\n\n1) Largest differential between platforms? 2) Arbitrage using best prices? 3) Exchanges vs sportsbooks vs prediction markets comparison 4) Exploitable edge?';
  document.getElementById('promptBox').textContent=msg;
  document.getElementById('analysisCard').classList.remove('hidden');
  log('prompt ready','ok');
}
function copyPrompt(){navigator.clipboard.writeText(document.getElementById('promptBox').textContent).then(()=>log('copied','ok')).catch(()=>log('copy failed','err'));}
